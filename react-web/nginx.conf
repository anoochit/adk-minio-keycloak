# react-web/nginx.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy ADK session & run endpoints to adk-server
    location ~ ^/(apps|run|run_sse)(/|$) {
        # Re-resolve adk-server's IP periodically; otherwise nginx caches the
        # hostname's IP at startup and returns 502 if adk-server is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $adk_upstream http://adk-server:8000;
        proxy_pass $adk_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward OAuth2 Proxy identity & token headers
        proxy_set_header X-Forwarded-Access-Token $http_x_forwarded_access_token;
        proxy_set_header X-Forwarded-Preferred-Username $http_x_forwarded_preferred_username;
        proxy_set_header X-Forwarded-User $http_x_forwarded_user;

        # Required for SSE streaming (/run_sse)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # SPA fallback for React routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}